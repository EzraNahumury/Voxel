[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200

# Celo is EVM-compatible. `paris` keeps block.prevrandao available while avoiding
# opcodes (e.g. transient storage / MCOPY) that may not be enabled on Celo yet.

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
